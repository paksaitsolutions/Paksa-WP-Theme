name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Validate, Build & Release
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. Resolve version
      #    On a tag push  → strip leading v  (v1.1.0 → 1.1.0)
      #    On a branch push → read from style.css directly
      # ------------------------------------------------------------------ #
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            TAG=""
            VERSION=$(grep -m1 '^ \* Version:' paksa-it-solutions/style.css \
              | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag: ${TAG:-none})"

      # ------------------------------------------------------------------ #
      # 3. Validate version consistency (tag pushes only)
      #    Git tag must match style.css Version header.
      # ------------------------------------------------------------------ #
      - name: Validate version consistency
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STYLE_VERSION=$(grep -m1 '^ \* Version:' paksa-it-solutions/style.css \
            | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          echo "Tag version : $VERSION"
          echo "style.css   : $STYLE_VERSION"
          if [ "$VERSION" != "$STYLE_VERSION" ]; then
            echo "::error::Version mismatch — tag is $VERSION but style.css says $STYLE_VERSION"
            exit 1
          fi

      # ------------------------------------------------------------------ #
      # 4. Validate required theme files exist
      # ------------------------------------------------------------------ #
      - name: Validate required theme files
        run: |
          REQUIRED=(
            "paksa-it-solutions/style.css"
            "paksa-it-solutions/functions.php"
            "paksa-it-solutions/index.php"
            "paksa-it-solutions/theme.json"
            "paksa-it-solutions/front-page.php"
            "paksa-it-solutions/header.php"
            "paksa-it-solutions/footer.php"
            "paksa-it-solutions/inc/updater.php"
          )
          MISSING=0
          for FILE in "${REQUIRED[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Required file missing: $FILE"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 1 ] && exit 1
          echo "All required files present."

      # ------------------------------------------------------------------ #
      # 5. PHP syntax check
      # ------------------------------------------------------------------ #
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none

      - name: PHP syntax check
        run: |
          ERRORS=0
          while IFS= read -r -d '' FILE; do
            if ! php -l "$FILE" > /dev/null 2>&1; then
              echo "::error::PHP syntax error in $FILE"
              php -l "$FILE"
              ERRORS=1
            fi
          done < <(find paksa-it-solutions -name '*.php' -print0)
          [ "$ERRORS" -eq 1 ] && exit 1
          echo "PHP syntax OK."

      # ------------------------------------------------------------------ #
      # 6. Secret scan
      #    Looks for hardcoded credentials — not normal variable assignments.
      #    Patterns are anchored to catch assignments with literal values.
      # ------------------------------------------------------------------ #
      - name: Secret scan
        run: |
          PATTERNS=(
            "AUTH_KEY\s*=\s*['\"][^'\"]{8}"
            "SECURE_AUTH_KEY\s*=\s*['\"][^'\"]{8}"
            "LOGGED_IN_KEY\s*=\s*['\"][^'\"]{8}"
            "NONCE_KEY\s*=\s*['\"][^'\"]{8}"
            "DB_PASSWORD\s*=\s*['\"][^'\"]"
            "smtp_pass\s*=\s*['\"][^'\"]"
            "access_token\s*=\s*['\"][^'\"]"
          )
          FOUND=0
          for PATTERN in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rniE "$PATTERN" paksa-it-solutions/ \
              --include="*.php" --include="*.js" --include="*.json" \
              --include="*.env" 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Possible hardcoded secret ($PATTERN):"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          [ "$FOUND" -eq 1 ] && exit 1
          echo "Secret scan passed."

      # ------------------------------------------------------------------ #
      # 7. Build release ZIP
      #    Structure: paksa-it-solutions/<theme files>
      # ------------------------------------------------------------------ #
      - name: Build release ZIP
        run: |
          ZIP_NAME="paksa-it-solutions-theme.zip"

          mkdir -p /tmp/theme-build/paksa-it-solutions

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.kilo' \
            --exclude='.kilocode' \
            --exclude='*.zip' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            paksa-it-solutions/ \
            /tmp/theme-build/paksa-it-solutions/

          cd /tmp/theme-build
          zip -r "$ZIP_NAME" paksa-it-solutions/
          mv "$ZIP_NAME" "$GITHUB_WORKSPACE/$ZIP_NAME"

          echo "ZIP built: $ZIP_NAME"
          ls -lh "$GITHUB_WORKSPACE/$ZIP_NAME"

      # ------------------------------------------------------------------ #
      # 8. Validate ZIP structure
      # ------------------------------------------------------------------ #
      - name: Validate ZIP structure
        run: |
          ZIP_NAME="paksa-it-solutions-theme.zip"
          ENTRIES=$(unzip -l "$ZIP_NAME" | awk '{print $4}')

          if ! echo "$ENTRIES" | grep -q '^paksa-it-solutions/style\.css$'; then
            echo "::error::ZIP structure invalid — paksa-it-solutions/style.css not found."
            unzip -l "$ZIP_NAME"
            exit 1
          fi

          if echo "$ENTRIES" | grep -q '^paksa-it-solutions/paksa-it-solutions/'; then
            echo "::error::ZIP structure invalid — nested directory detected."
            exit 1
          fi

          echo "ZIP structure valid."
          echo "Entry count: $(unzip -l "$ZIP_NAME" | tail -1)"

      # ------------------------------------------------------------------ #
      # 9. Create GitHub Release and attach ZIP (tag pushes only)
      # ------------------------------------------------------------------ #
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Paksa IT Solutions Theme ${{ steps.version.outputs.version }}"
          body: |
            ## Paksa IT Solutions Theme ${{ steps.version.outputs.version }}

            ### Installation
            Download `paksa-it-solutions-theme.zip` and install via **Appearance → Themes → Add New → Upload Theme**.

            ### Update (existing installations)
            WordPress will detect this release automatically via the built-in update checker.
            Go to **Dashboard → Updates** to apply.

            ### Database Safety
            This update replaces theme code only. All WordPress content (products, services,
            pages, menus, Customizer settings, media) is preserved.

            ### Changelog
            See commit history for detailed changes.
          files: paksa-it-solutions-theme.zip
          draft: false
          prerelease: false
